<!DOCTYPE html>
<html lang="en">
  <link rel="icon" href="/makesense.logo.png" type="image/x-icon">
<head>
  <meta charset="UTF-8" />
  <title>TV</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="manifest" href="/js/manifest.json" />
  <meta name="theme-color" content="#09090b" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #050509;
      --bg-elevated: #111119;
      --accent: #18a34a;
      --accent-soft: rgba(24,163,74,0.15);
      --text: #fafafa;
      --muted: #9ca3af;
      --border: #27272f;
      --danger: #f97373;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #111827 0, #050509 55%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    #app {
      width: 100%;
      max-width: 480px;
      height: 100%;
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 32px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #f97316, #dc2626 55%, #7c2d12);
      box-shadow: 0 0 0 1px rgba(248, 250, 252, 0.06), 0 8px 18px rgba(0, 0, 0, 0.7);
      font-size: 13px;
      font-weight: 800;
    }
    .brand-text-main { font-weight: 700; }
    .brand-text-sub {
      font-size: 11px;
      text-transform: none;
      color: var(--muted);
      letter-spacing: 0;
    }
    .clock {
      font-feature-settings: "tnum" 1, "kern" 1;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: linear-gradient(145deg, rgba(15,23,42,0.9), rgba(15,23,42,0.4));
      box-shadow: 0 0 0 1px rgba(15,23,42,0.6), inset 0 0 0 0.5px rgba(148,163,184,0.35);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .clock-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #22c55e, #15803d);
      box-shadow: 0 0 0 1px rgba(22,163,74,0.5), 0 0 0 4px rgba(22,163,74,0.18);
    }

    /* Player */
    .player-shell {
      position: relative;
      border-radius: 14px;
      background: radial-gradient(circle at top left, #1f2937 0, #020617 55%);
      box-shadow:
        0 0 0 1px rgba(15,23,42,0.9),
        0 18px 40px rgba(0,0,0,0.9);
      overflow: hidden;
      aspect-ratio: 16 / 9;
      min-height: 0;
    }
    #video-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at center, #020617 0, #000 60%);
    }
    #video {
      width: 100%;
      height: 100%;
      background: transparent;
    }
    .player-overlay-top {
      position: absolute;
      inset: 0;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }
    .pill-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .current-channel-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 7px 4px 4px;
      background: linear-gradient(120deg, rgba(15,23,42,0.96), rgba(15,23,42,0.75));
      border: 1px solid rgba(148,163,184,0.5);
      box-shadow:
        0 0 0 1px rgba(15,23,42,1),
        0 8px 16px rgba(0,0,0,0.85);
      max-width: 72%;
    }
    .current-channel-logo {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: #020617;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(15,23,42,1), 0 0 0 1px rgba(148,163,184,0.5);
    }
    .current-channel-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .current-channel-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .current-channel-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .current-channel-meta {
      font-size: 10px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .badge-live {
      padding: 1px 5px;
      border-radius: 999px;
      background: rgba(220,38,38,0.15);
      border: 1px solid rgba(248,113,113,0.9);
      color: #fecaca;
      text-transform: uppercase;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .badge-quality {
      padding: 1px 5px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.5);
      color: #e5e7eb;
      font-size: 9px;
    }

    .quick-controls {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 10px;
      border: 1px solid rgba(148,163,184,0.6);
      background: rgba(15,23,42,0.92);
      color: #e5e7eb;
      box-shadow: 0 6px 14px rgba(0,0,0,0.75);
    }
    .chip-secondary {
      border-style: dashed;
      opacity: 0.8;
    }

    .player-overlay-bottom {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      padding: 0 8px 6px;
      pointer-events: none;
    }
    .status-bar {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 999px;
      background: linear-gradient(120deg, rgba(15,23,42,0.96), rgba(15,23,42,0.9));
      border: 1px solid rgba(148,163,184,0.6);
      box-shadow:
        0 0 0 1px rgba(15,23,42,0.95),
        0 10px 24px rgba(0,0,0,0.9);
      font-size: 10px;
      color: var(--muted);
    }
    .status-left {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a);
      box-shadow: 0 0 0 1px rgba(34,197,94,0.6), 0 0 0 4px rgba(22,163,74,0.2);
    }
    .status-text {
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .status-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-pill {
      padding: 1px 5px;
      border-radius: 999px;
      border: 1px dashed rgba(148,163,184,0.6);
      background: rgba(15,23,42,0.9);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .status-pill span {
      font-size: 9px;
    }

    /* Search & category row */
    .controls-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 2px;
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(15,23,42,0.88);
      border: 1px solid rgba(75,85,99,0.8);
      box-shadow: 0 0 0 1px rgba(15,23,42,0.9), 0 10px 22px rgba(15,23,42,0.9);
    }
    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      outline: none;
      min-width: 0;
    }
    .search-input::placeholder {
      color: rgba(148,163,184,0.8);
    }
    .search-icon {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--muted);
    }
    .badge-count {
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.6);
      background: rgba(15,23,42,0.92);
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .category-tabs {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(55,65,81,0.9);
      background: rgba(15,23,42,0.92);
      font-size: 11px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .tab span.badge {
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(75,85,99,0.9);
      font-size: 9px;
    }
    .tab.active {
      border-color: rgba(34,197,94,0.9);
      background: radial-gradient(circle at top left, rgba(34,197,94,0.3), rgba(6,78,59,0.96));
      color: #bbf7d0;
      box-shadow:
        0 0 0 1px rgba(6,95,70,0.85),
        0 10px 24px rgba(4,120,87,0.85);
    }

    /* Channel list */
    .channels-shell {
      flex: 1;
      min-height: 0;
      margin-top: 2px;
      border-radius: 14px;
      background: radial-gradient(circle at top, #020617 0, #020617 48%, #000 100%);
      border: 1px solid rgba(31,41,55,0.95);
      box-shadow:
        0 0 0 1px rgba(15,23,42,1),
        0 18px 40px rgba(0,0,0,1);
      padding: 6px 6px 7px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .channels-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .channels-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .channels-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8);
      box-shadow: 0 0 0 1px rgba(59,130,246,0.7), 0 0 0 4px rgba(59,130,246,0.25);
    }
    .channels-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .channels-scroll::-webkit-scrollbar {
      width: 3px;
    }
    .channels-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .channels-scroll::-webkit-scrollbar-thumb {
      background: rgba(75,85,99,0.9);
      border-radius: 999px;
    }
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      padding-bottom: 2px;
    }
    .channel-card {
      position: relative;
      border-radius: 11px;
      padding: 6px;
      background: radial-gradient(circle at top, #111827 0, #020617 52%);
      border: 1px solid rgba(55,65,81,0.95);
      box-shadow:
        0 0 0 1px rgba(15,23,42,1),
        0 12px 26px rgba(0,0,0,1);
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .channel-card.active {
      border-color: rgba(34,197,94,0.95);
      box-shadow:
        0 0 0 1px rgba(22,163,74,0.95),
        0 12px 30px rgba(22,163,74,0.85);
    }
    .channel-logo-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .channel-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scale(1.02);
    }
    .channel-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .channel-name {
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .channel-meta {
      font-size: 9px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .channel-meta-pill {
      padding: 1px 4px;
      border-radius: 999px;
      border: 1px solid rgba(75,85,99,0.9);
      background: rgba(15,23,42,0.95);
      white-space: nowrap;
    }
    .channel-live-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #f97373;
      box-shadow: 0 0 0 1px rgba(248,113,113,0.9);
    }

    .empty-state {
      padding: 20px 8px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .badge-soft {
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(55,65,81,0.9);
      background: rgba(15,23,42,0.92);
      font-size: 10px;
      color: var(--muted);
    }

    button {
      font: inherit;
    }

    .osd {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(15,23,42,0.96);
      border: 1px solid rgba(148,163,184,0.8);
      box-shadow: 0 10px 24px rgba(0,0,0,0.9);
      font-size: 11px;
      max-width: 60%;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.18s ease-out, transform 0.18s ease-out;
    }
    .osd.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .osd-name {
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .osd-meta {
      font-size: 10px;
      color: var(--muted);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .favorite-toggle {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: none;
      background: rgba(15,23,42,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(148,163,184,0.9);
      font-size: 11px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.7);
      cursor: pointer;
    }
    .favorite-toggle.active {
      background: rgba(234,179,8,0.18);
      color: #facc15;
      box-shadow:
        0 0 0 1px rgba(250,204,21,0.7),
        0 6px 14px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="top-bar">
      <div class="brand">
        <div class="brand-pill">tv</div>
        <div>
          <div class="brand-text-main"></div>
          <div class="brand-text-sub">Live channels</div>
        </div>
      </div>
      <div class="clock" id="clock">
        <div class="clock-dot"></div>
        <span>—</span>
      </div>
    </div>

    <div class="player-shell">
      <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div class="player-overlay-top">
          <div class="pill-row">
            <div class="current-channel-pill" id="current-channel-pill">
              <div class="current-channel-logo">
                <img id="current-channel-logo" alt="Channel logo" src="/img/play-button.png" />
              </div>
              <div class="current-channel-text">
                <div class="current-channel-name" id="current-channel-name">Loading…</div>
                <div class="current-channel-meta">
                  <span class="badge-live">LIVE</span>
                  <span class="badge-quality" id="current-channel-quality">Auto</span>
                </div>
              </div>
            </div>
            <div class="quick-controls">
              <button class="chip" id="btn-mute-toggle" type="button">
                <span id="mute-label">Unmute</span>
              </button>
              <button class="chip chip-secondary" id="btn-fullscreen" type="button">
                FS
              </button>
            </div>
          </div>
          <div id="osd" class="osd">
            <div id="osd-name" class="osd-name"></div>
            <div id="osd-meta" class="osd-meta"></div>
          </div>
        </div>
        <div class="player-overlay-bottom">
          <div class="status-bar">
            <div class="status-left">
              <div class="status-dot" id="status-dot"></div>
              <div class="status-text" id="status-text">Preparing player…</div>
            </div>
            <div class="status-right">
              <div class="status-pill">
                <span id="status-tech">—</span>
              </div>
              <div class="status-pill">
                <span id="status-category">All</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls-row">
      <div class="search-row">
        <div class="search-box">
          <div class="search-icon">⌕</div>
          <input
            id="search-input"
            class="search-input"
            placeholder="Search channel"
            autocomplete="off"
          />
        </div>
        <div class="badge-count" id="badge-count">0 ch</div>
      </div>
      <div class="category-tabs" id="category-tabs"></div>
    </div>

    <div class="channels-shell">
      <div class="channels-header">
        <div class="channels-header-left">
          <div class="channels-dot"></div>
          <span id="channels-header-text">Channels</span>
        </div>
        <div class="badge-soft" id="badge-filter">All</div>
      </div>
      <div class="channels-scroll">
        <div id="channels-grid" class="channels-grid"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
          No channels match your search.
        </div>
      </div>
    </div>
  </div>
  <script src="/js/shaka-player.ui.min.js"></script>
  <script type="module" src="/js/main-app.js"></script>
</body>
</html>
